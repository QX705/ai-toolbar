<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 工具栏</title>
  <link rel="stylesheet" href="css/style.css?v=1.0.5" />
  <script>
    // 临时调试：捕获脚本加载/模块错误 + console.error
    window.addEventListener("error", function (e) {
      var msg = e.message ? ("msg: " + e.message) : ("resource: " + (e.target && (e.target.src || e.target.href) || "?"));
      (window.__errs = window.__errs || []).push(msg.slice(0, 150));
    }, true);
    (function () {
      window.__console = [];
      var orig = console.error;
      console.error = function () {
        try { window.__console.push([].slice.call(arguments).map(String).join(" ").slice(0, 200)); } catch (e) {}
        orig.apply(console, arguments);
      };
    })();
  </script>
</head>
<body>

  <!-- 顶栏：标题 + 搜索 + 笔记 + 添加 + 账号 -->
  <header class="topbar">
    <div class="container topbar-inner">
      <div class="brand">🤖 <span>AI 工具栏</span></div>
      <div class="search-box">
        <svg viewBox="0 0 24 24" width="16" height="16" class="icon-search"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="searchInput" type="text" placeholder="搜索工具名称或网址..." autocomplete="off" />
      </div>
      <div class="user-area" id="userArea" hidden>
        <!-- 未登录 -->
        <button id="loginBtn" class="btn btn-primary">登录 / 注册</button>
        <!-- 已登录 -->
        <span id="userChip" hidden>
          <span id="userEmail" class="user-email" title=""></span>
          <button id="changePwBtn" class="btn btn-ghost">修改密码</button>
          <button id="logoutBtn" class="btn btn-ghost">退出</button>
        </span>
      </div>
    </div>
  </header>

  <!-- 控制条：分类下拉 + 考试官网 + 学习通/笔记 + 添加工具 -->
  <div class="container">
    <div class="control-bar">
      <select id="categorySelect" aria-label="选择分类"></select>
      <select id="examSelect" aria-label="考试官网">
        <!-- 👇 在下面继续加 <option value="网址">名称</option> 即可，例如：
        <option value="https://yz.chsi.com.cn">研招网</option>
        -->
        <option value="https://www.neea.edu.cn">中国教育考试网</option>
        <option value="https://cet-bm.neea.edu.cn">大学生四/六级</option>
        <option value="https://ntce.neea.edu.cn">中小学教资考试</option>
        <option value="https://ncre-bm.neea.cn">计算机二级</option>
        <option value="https://chengkao.neea.edu.cn">成人高考</option>
        <option value="https://yankao.neea.edu.cn">研究生考试</option>
        <option value="https://ielts-main.neea.cn">雅思(IELTS)</option>


      </select>
      <button id="studyJump" class="btn btn-ghost" type="button" hidden title="打开学习通">📚 学习通</button>
      <button id="notesToggle" class="btn btn-ghost" type="button">📝 笔记</button>
      <button id="desktopToggle" class="btn btn-ghost" type="button" title="全屏桌面启动器">🖥 桌面</button>
      <button id="addBtn" class="btn btn-primary" type="button">＋ 添加工具</button>
    </div>
  </div>

  <main class="container">
    <!-- 学习通内嵌卡片（点击控制条"学习通"切换显示） -->
    <section class="tool-section" id="studySection" hidden>
      <div class="study-card">
        <iframe id="studyFrame" class="study-frame" src="https://i.chaoxing.com" title="学习通"></iframe>

      </div>
    </section>

    <!-- 笔记卡片（点击控制条"笔记"切换显示，独立一页） -->
    <section class="tool-section" id="notesSection" hidden>
      <div class="notes2">
        <span id="noteStatus" class="note-status view-status"></span>
        <div class="notes2-layout">
          <aside class="notes2-side">
            <input id="noteSearch" class="notes2-search" type="text" placeholder="🔍 搜索笔记…" autocomplete="off" />
            <button id="noteNew" class="btn btn-primary notes2-new" type="button">＋ 新建笔记</button>
            <div id="noteList" class="notes2-list"></div>
          </aside>
          <div class="notes2-main" id="notes2Main">
            <input id="noteTitle" class="notes2-title" type="text" placeholder="笔记标题" maxlength="60" autocomplete="off" />
            <div class="notes2-toolbar">
              <button data-md="mdBold" type="button" title="加粗 **文本**"><b>B</b></button>
              <button data-md="mdItalic" type="button" title="斜体 *文本*"><i>I</i></button>
              <button data-md="mdHead" type="button" title="标题 ## ">H</button>
              <button data-md="mdUl" type="button" title="无序列表 - ">• 三</button>
              <button data-md="mdTask" type="button" title="待办清单 - [ ] ">☑</button>
              <button data-md="mdCode" type="button" title="行内代码 `">`Code`</button>
              <button data-md="mdQuote" type="button" title="引用 >">&gt; 引</button>
              <button data-md="mdLink" type="button" title="链接 [文字](网址)">🔗</button>
              <button id="noteAttach" class="notes2-toolbar-btn" type="button" title="插入附件（图片/PDF/文档，50MB 内）">📎</button>
              <input id="noteFileInput" type="file" multiple hidden />
              <span class="notes2-flex"></span>
              <button id="notePreviewBtn" class="notes2-preview-btn" type="button">👁 预览</button>
            </div>
            <div class="notes2-editor" id="notes2Editor">
              <textarea id="noteText" placeholder="记点什么… 支持 Markdown：## 标题、- 清单、- [ ] 待办、**加粗**"></textarea>
              <div id="notePreview" class="md-preview"></div>
            </div>
            <div class="notes2-foot">
              <span id="noteMeta" class="notes2-meta"></span>
              <span class="notes2-flex"></span>
              <button id="noteExport" class="btn btn-ghost notes2-foot-btn" type="button">⬇ 导出 .md</button>
              <button id="noteDelete" class="btn btn-ghost notes2-foot-btn danger" type="button">🗑 删除</button>
            </div>
          </div>
          <div class="notes2-empty" id="notesEmpty" hidden>
            <p class="notes2-empty-icon">🗒️</p>
            <p>还没有笔记</p>
            <button id="notesEmptyNew" class="btn btn-primary" type="button">＋ 新建第一篇</button>
          </div>
        </div>
        <p class="notes-note">未登录时保存在本浏览器；登录后自动同步到云端，换设备也不丢。支持 Markdown 与待办清单。</p>
      </div>
    </section>

    <!-- 桌面模式（点击控制条"桌面"切换，全屏启动器；数据与其他视图同源同步） -->
    <section class="tool-section" id="desktopSection" hidden>
      <div class="dt-desktop" id="dtRoot">
        <div class="dt-topbar">
          <div class="dt-clock">
            <div class="dt-time" id="dtTime"></div>
            <div class="dt-date" id="dtDate"></div>
          </div>
          <div class="dt-quick">
            <button id="dtNotesBtn" class="dt-quick-btn" type="button" title="笔记">📝</button>
            <button id="dtStudyBtn" class="dt-quick-btn" type="button" title="学习通">📚</button>
            <button id="dtExitBtn" class="dt-quick-btn" type="button" title="退出桌面模式 (Esc)">✕</button>
          </div>
        </div>
        <form class="dt-search" id="dtSearchForm">
          <input id="dtSearchInput" type="text" placeholder="搜索一下…" autocomplete="off" />
          <div class="dt-engines" id="dtEngines"></div>
        </form>
        <div class="dt-body">
          <aside class="dt-dock" id="dtDock"></aside>
          <div class="dt-grid" id="dtGrid"></div>
        </div>
        <div class="dt-wallpaper-pop" id="dtWallpaperPop" hidden>
          <p class="dt-wp-title">桌面背景</p>
          <div class="dt-wp-presets" id="dtWpPresets"></div>
          <input id="dtWallpaperUrl" type="text" placeholder="粘贴图片直链 https://…" />
          <button id="dtWpApply" class="dt-wp-clear" type="button">应用图片背景</button>
          <button id="dtWpReset" class="dt-wp-clear" type="button">恢复默认渐变</button>
        </div>
      </div>
    </section>

    <!-- 工具卡片（按分类分组） -->
    <div id="toolSections"></div>

    <!-- 空状态 -->
    <div class="empty-state" id="emptyState" hidden>
      <p class="empty-icon">📭</p>
      <p>没有找到工具</p>
      <p class="empty-tip">试试其他关键词，或点击右上角「添加工具」</p>
    </div>
  </main>

  <footer class="footer">
    <p>未登录时，链接和笔记保存在本浏览器中；登录后自动同步到云端，换设备也不丢。</p>
    <button id="resetBtn" class="reset-link" type="button">↺ 恢复默认工具列表</button>
  </footer>

  <!-- 添加 / 编辑 弹窗 -->
  <div class="modal-mask" id="modalMask" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <h3 id="modalTitle">添加工具</h3>
      <form id="toolForm" autocomplete="off">
        <label class="field">
          <span>工具名称</span>
          <input id="toolName" required maxlength="20" placeholder="例如：通义千问" />
        </label>
        <label class="field">
          <span>网址</span>
          <input id="toolUrl" required placeholder="例如：https://tongyi.aliyun.com" />
        </label>
        <label class="field">
          <span>分类</span>
          <select id="toolCategory"></select>
        </label>
        <p class="form-error" id="formError"></p>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="cancelBtn">取消</button>
          <button type="submit" class="btn btn-primary" id="saveToolBtn">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 登录 / 注册 弹窗 -->
  <div class="modal-mask" id="authMask" hidden>
    <div class="auth-stage" id="authStage"></div>
    <div class="modal auth-modal" role="dialog" aria-modal="true">
      <button class="modal-close" id="authX" type="button" title="关闭">✕</button>
      <div class="auth-brand">
        <span class="auth-logo">🤖</span>
        <h3 id="authTitle">欢迎回来</h3>
        <p class="auth-sub" id="authSub">登录后笔记与工具全设备同步</p>
      </div>
      <div class="auth-tabs">
        <button type="button" class="auth-tab active" id="tabLogin">登录</button>
        <button type="button" class="auth-tab" id="tabRegister">注册</button>
      </div>
      <form id="authForm" autocomplete="off">
        <label class="field">
          <span>邮箱</span>
          <input id="authEmail" type="email" required placeholder="you@example.com" />
        </label>
        <label class="field">
          <span>密码</span>
          <div class="pw-wrap">
            <input id="authPassword" type="password" required minlength="6" placeholder="至少 6 位" autocomplete="current-password" />
            <button type="button" class="pw-eye" id="pwEye" title="显示 / 隐藏密码">👁</button>
          </div>
        </label>
        <p class="form-error" id="authError"></p>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="authCancel">取消</button>
          <button type="submit" class="btn btn-primary" id="authSubmit">登录</button>
        </div>
      </form>
      <p class="auth-foot">🔒 账号由 Supabase 加密托管，换设备登录数据自动跟随</p>
    </div>
  </div>

  <!-- 修改密码 弹窗 -->
  <div class="modal-mask" id="pwMask" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <h3>修改密码</h3>
      <form id="pwForm" autocomplete="off">
        <label class="field">
          <span>新密码</span>
          <input id="pwNew" type="password" required minlength="6" placeholder="至少 6 位" />
        </label>
        <p class="form-error" id="pwError"></p>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="pwCancel">取消</button>
          <button type="submit" class="btn btn-primary">保存新密码</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Supabase SDK 改为在 main.js 中异步加载：CDN 不通时不阻塞页面 -->
  <script src="js/config.js?v=1.0.5"></script>
  <script src="js/main.js?v=1.0.5" type="module"></script>
</body>
</html>
